
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .font-heading {
            font-family: 'Space+Grotesk', sans-serif;
        }
        ::-webkit-scrollbar {
          width: 6px;
        }
        ::-webkit-scrollbar-track {
          background: #050505;
        }
        ::-webkit-scrollbar-thumb {
          background: #27272a;
          border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #3f3f46;
        }
    </style>
<script>
  // GitHub Pages 静态环境兼容：模拟 process 对象，防止 API 调用时 ReferenceError
  window.process = {
    env: {
      API_KEY: "" 
    }
  };
</script>
<!-- 引入 Babel 用于浏览器端实时编译 TSX 代码 -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@19.2.4/",
    "react/": "https://esm.sh/react@19.2.4/",
    "react": "https://esm.sh/react@19.2.4",
    "react-router-dom": "https://esm.sh/react-router-dom@7.13.0",
    "@google/genai": "https://esm.sh/@google/genai@1.38.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <!-- 使用 Babel 编译入口文件，需指定 data-presets 以包含 TypeScript 和 React 支持 -->
    <script type="text/babel" data-presets="react,typescript" data-type="module" src="./index.tsx"></script>
</body>
</html>
